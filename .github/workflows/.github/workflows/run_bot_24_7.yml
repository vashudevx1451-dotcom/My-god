name: TeleClean 24x7 Bot (5-Hour Auto Restart)

on:
  workflow_dispatch:
  schedule:
    # Har 5 ghante me automatic backup trigger
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

# Agar purana session chal raha ho to use cancel karke naya start karega (No 409 Conflict)
concurrency:
  group: teleclean-telegram-bot-24x7
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram Bot (5 Hours)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAX_RUNTIME_SECONDS: '18000'
        run: python bot.py

      - name: Auto-Restart Next 5-Hour Session Immediately (24/7 Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Triggering next 5-hour bot session..."
          sleep 5
          gh workflow run run_bot_24_7.yml --ref "${{ github.ref_name }}" || gh workflow run "run_bot_24_7.yml" || true
