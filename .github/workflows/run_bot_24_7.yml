name: TeleClean 24x7 Bot (5-Hour Auto Restart)

on:
  workflow_dispatch:
  schedule:
    # Har 5 ghante me auto trigger
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: teleclean-telegram-bot-24x7
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyTelegramBotAPI>=4.22.0" "requests>=2.32.0" "urllib3>=2.2.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify bot.py exists
        run: |
          if [ ! -f "bot.py" ]; then
            echo "❌ ERROR: 'bot.py' file repository me nahi mila!"
            echo "Kripya repository root me 'bot.py' banayein."
            exit 1
          fi
          echo "✅ bot.py found."

      - name: Run Telegram Bot (5 Hours)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAX_RUNTIME_SECONDS: '18000'
        run: python bot.py

      - name: Auto-Restart Next 5-Hour Session (24/7 Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing next 5-hour session..."
          sleep 10
          gh workflow run "run_bot_24_7.yml" || true
